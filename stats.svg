<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 210" width="500" height="210" role="img" aria-label="Rima Adhikary GitHub stats">
<defs><linearGradient id="bgS" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#1a0730"/><stop offset="1" stop-color="#120522"/></linearGradient>
  <linearGradient id="ringS" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6ec7"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
  <style>@keyframes sIn{to{opacity:1;transform:translate(0,0)}}
   @keyframes ringGo{to{stroke-dashoffset:95.0}}
   @keyframes fz{to{opacity:1}}
   .ring{stroke-dasharray:339.3;stroke-dashoffset:339.3;animation:ringGo 1.6s cubic-bezier(.4,0,.2,1) .5s forwards}
   .rk{opacity:0;animation:fz .6s ease 1.4s forwards}</style></defs>
<rect x="1" y="1" width="498" height="208" rx="16" fill="url(#bgS)" stroke="rgba(255,110,199,.5)" stroke-width="1.5"/>
<text x="24" y="38" font-size="19" font-weight="800" fill="#ff9ad5" font-family="'Segoe UI',sans-serif">Rima Adhikary's GitHub Stats</text>
<line x1="24" y1="48" x2="340" y2="48" stroke="rgba(168,85,247,.35)"/>
<g opacity="0" transform="translate(-16,0)" style="animation:sIn .55s ease 0.40s forwards"><text x="34" y="64" font-size="15" fill="#ff6ec7">★</text><text x="58" y="64" font-size="14" fill="#cdaaf0" font-family="'Segoe UI',sans-serif">Total Stars Earned</text><text x="330" y="64" font-size="14" fill="#f7ecff" font-weight="700" text-anchor="end" font-family="ui-monospace,monospace">12</text></g><g opacity="0" transform="translate(-16,0)" style="animation:sIn .55s ease 0.54s forwards"><text x="34" y="92" font-size="15" fill="#ff6ec7">⭑</text><text x="58" y="92" font-size="14" fill="#cdaaf0" font-family="'Segoe UI',sans-serif">Total Commits (2026)</text><text x="330" y="92" font-size="14" fill="#f7ecff" font-weight="700" text-anchor="end" font-family="ui-monospace,monospace">247</text></g><g opacity="0" transform="translate(-16,0)" style="animation:sIn .55s ease 0.68s forwards"><text x="34" y="120" font-size="15" fill="#ff6ec7">⇄</text><text x="58" y="120" font-size="14" fill="#cdaaf0" font-family="'Segoe UI',sans-serif">Total PRs</text><text x="330" y="120" font-size="14" fill="#f7ecff" font-weight="700" text-anchor="end" font-family="ui-monospace,monospace">8</text></g><g opacity="0" transform="translate(-16,0)" style="animation:sIn .55s ease 0.82s forwards"><text x="34" y="148" font-size="15" fill="#ff6ec7">◉</text><text x="58" y="148" font-size="14" fill="#cdaaf0" font-family="'Segoe UI',sans-serif">Total Issues</text><text x="330" y="148" font-size="14" fill="#f7ecff" font-weight="700" text-anchor="end" font-family="ui-monospace,monospace">15</text></g><g opacity="0" transform="translate(-16,0)" style="animation:sIn .55s ease 0.96s forwards"><text x="34" y="176" font-size="15" fill="#ff6ec7">✔</text><text x="58" y="176" font-size="14" fill="#cdaaf0" font-family="'Segoe UI',sans-serif">Contributed to</text><text x="330" y="176" font-size="14" fill="#f7ecff" font-weight="700" text-anchor="end" font-family="ui-monospace,monospace">3</text></g>
<circle cx="402" cy="112" r="54" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="9"/>
<circle class="ring" cx="402" cy="112" r="54" fill="none" stroke="url(#ringS)" stroke-width="9" stroke-linecap="round" transform="rotate(-90 402 112)"/>
<g class="rk"><text x="402" y="114" text-anchor="middle" font-size="34" font-weight="800" fill="#f7ecff" font-family="'Segoe UI',sans-serif">A</text>
<text x="402" y="134" text-anchor="middle" font-size="11" fill="#a883d0" font-family="ui-monospace,monospace">RANK</text></g>
</svg>